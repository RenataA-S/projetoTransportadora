<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Transportadora Paulão</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
    <img src="img/LogoTransportadora.jpeg" alt="Logo" class="system-logo" style="height: 60px; margin-bottom: 12px;">
    <h2>Acesso ao Sistema</h2>

    <form onsubmit="event.preventDefault(); const e = document.getElementById('login-email').value; const s = document.getElementById('login-senha').value; fazerLogin(e, s);">
      <div class="form-group" style="margin-bottom: 12px; text-align: left;">
        <label for="login-email">E-mail / Usuário</label>
        <input type="email" id="login-email" placeholder="usuario@paulao.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 16px; text-align: left;">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" placeholder="******" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
    </form>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
