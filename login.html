<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Transportadora Paulão</title>
  <link rel="icon" type="image/jpeg" href="img/LogoTransportadora.jpeg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 1rem;">
      <img src="img/LogoTransportadora.jpeg" alt="Logo Transportadora Paulão" style="height: 70px; width: auto; object-fit: contain;">
    </div>
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Transportadora Paulão</h2>
    <form id="form-login" onsubmit="event.preventDefault(); realizarLogin();">
      <div class="form-group">
        <label for="login-email">E-mail Operacional</label>
        <input type="email" id="login-email" required placeholder="usuario@transportadorapaulao.com">
      </div>
      <div class="form-group">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" required placeholder="******">
      </div>
      <button type="submit" class="btn btn-primary btn-block">ENTRAR</button>
    </form>
    <div id="login-erro" class="alert alert-danger hidden"></div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
