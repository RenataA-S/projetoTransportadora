<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregamento & Descarga - Transportadora Paulão</title>
  <link rel="icon" type="image/jpeg" href="img/LogoTransportadora.jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <header class="main-header">
    <div class="logo-container">
      <img src="img/LogoTransportadora.jpeg" alt="Logo Transportadora Paulão" class="system-logo">
      <div>
        <h1>Transportadora Paulão</h1>
        <span class="system-title">Gestão de Carregamento & Descarga</span>
      </div>
    </div>
    <nav class="nav-menu">
      <a href="index.html">Entrada</a>
      <a href="carregamento.html" class="active">Carregamento / Descarga</a>
      <a href="balanca-saida.html">Balança Saída</a>
      <a href="administrativo.html">Painel Admin</a>
      <button id="btn-logout" class="btn-logout">Sair</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Localizar Operação de Pátio</h2>
      <div class="form-group-row" style="display: flex; gap: 12px; margin-top: 12px;">
        <input type="text" id="busca-op-carregamento" placeholder="Número OP-YYYYMMDD-XXXX" style="flex: 1;">
        <button class="btn btn-secondary" onclick="buscarOperacaoManual('CARREGAMENTO')">Buscar</button>
      </div>
    </section>

    <section id="secao-processo-carregamento" class="card hidden">
      <h3>Controle de Doca</h3>
      <div class="info-box" style="margin: 12px 0;">
        <p><strong>OP:</strong> <span id="carr-op"></span></p>
        <p><strong>Placa:</strong> <span id="carr-placa"></span></p>
      </div>

      <!-- FASE 1: Seleção e Início -->
      <div id="fase-inicio" class="fase-box">
        <h4>Iniciar Etapa</h4>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="tipoOperacao">Tipo de Operação</label>
          <select id="tipoOperacao">
            <option value="CARREGAMENTO">Carregamento</option>
            <option value="DESCARGA">Descarga</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" onclick="iniciarEtapaCarregamento()">Iniciar Processo</button>
      </div>

      <!-- FASE 2: Finalização do Processo de Doca -->
      <div id="fase-fim" class="fase-box hidden">
        <h4 id="titulo-fase-fim">Finalizar e Conferir</h4>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="nomeConferente">Nome do Conferente *</label>
          <input type="text" id="nomeConferente" required placeholder="Ex: Carlos Oliveira">
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="observacoesConferencia">Observações / Avarias / Divergências</label>
          <textarea id="observacoesConferencia" rows="3" placeholder="Registre avarias ou observações da carga..."></textarea>
        </div>
        <button type="button" class="btn btn-success" onclick="finalizarEtapaCarregamento()">Finalizar Carregamento / Descarga</button>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
