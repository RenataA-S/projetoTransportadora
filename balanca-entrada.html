<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balança de Entrada - Transportadora Paulão</title>
  <link rel="icon" type="image/jpeg" href="img/LogoTransportadora.jpeg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
  <header class="main-header">
    <div class="logo-container">
      <img src="img/LogoTransportadora.jpeg" alt="Logo Transportadora Paulão" class="system-logo">
      <div>
        <h1>Transportadora Paulão</h1>
        <span class="system-title">Balança Rodoviária - Entrada</span>
      </div>
    </div>
    <nav class="nav-menu">
      <a href="index.html">Entrada</a>
      <a href="balanca-entrada.html" class="active">Balança Entrada</a>
      <a href="carregamento.html">Carregamento</a>
      <a href="balanca-saida.html">Balança Saída</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Busca de Operação para Pesagem Inicial</h2>
      <div class="form-group-row">
        <div class="form-group">
          <label for="busca-op">Número da Operação</label>
          <input type="text" id="busca-op" placeholder="OP-YYYYMMDD-XXXX">
        </div>
        <button class="btn btn-secondary" onclick="buscarOperacaoManual('ENTRADA')">Buscar Operação</button>
      </div>
      <hr style="margin: 15px 0;">
      <div class="qr-scanner-section">
        <button class="btn btn-primary" onclick="iniciarLeitorQRCode('reader-balanca-entrada', 'ENTRADA')">Abrir Leitor QR Code</button>
        <div id="reader-balanca-entrada" class="qr-reader-box"></div>
      </div>
    </section>

    <section id="detalhes-operacao" class="card hidden">
      <h3>Dados da Operação Identificada</h3>
      <div class="grid-read-only">
        <p><strong>Operação:</strong> <span id="read-op"></span></p>
        <p><strong>Placa:</strong> <span id="read-placa"></span></p>
        <p><strong>Motorista:</strong> <span id="read-motorista"></span></p>
        <p><strong>CPF:</strong> <span id="read-cpf"></span></p>
        <p><strong>Ajudante:</strong> <span id="read-ajudante"></span></p>
        <p><strong>Status Atual:</strong> <span id="read-status" class="badge"></span></p>
      </div>

      <form id="form-pesagem-entrada" onsubmit="event.preventDefault(); registrarPesoEntrada();">
        <div class="form-group campo-peso-destaque">
          <label for="pesoEntrada" style="font-size: 1.1rem; color: var(--primary-color);">PESO DE ENTRADA (KG) *</label>
          <input type="number" id="pesoEntrada" step="0.01" required placeholder="Ex: 18450" style="font-size: 1.3rem; font-weight: bold; border: 2px solid var(--primary-color);">
        </div>
        <button type="submit" class="btn btn-success btn-block" style="font-size: 1.1rem; margin-top: 10px;">Salvar Pesagem e Enviar para Doca</button>
      </form>
    </section>
  </main>
  
  <script type="module" src="script.js"></script>
</body>
</html>
